# Installed as /etc/nginx/conf.d/default.conf (see Dockerfile.nginx).
# Plain HTTP only: TLS and authentication are handled by the external access layer in front.

server {
    listen 80;
    server_name _;

    root /srv;
    index index.html;

    # Excel uploads (real files reach ~20 MB).
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Docker's embedded DNS; lets nginx start and re-resolve even if `api` restarts.
    resolver 127.0.0.11 valid=10s;

    # /api/* -> FastAPI with the /api prefix stripped (same as the Vite dev proxy).
    location /api/ {
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static web app, with SPA fallback to index.html (never cached).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
