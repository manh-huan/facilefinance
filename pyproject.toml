[project]
name = "facilefinance"
version = "0.1.0"
description = "Personal assistant for corporate finance teams: cash-flow management."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "python-calamine",
    "openpyxl",
    "polars",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]",
    "anthropic",
    "pyyaml",
]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "types-pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/facilefinance"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "apps", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
