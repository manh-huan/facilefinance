name: facilefinance

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: facilefinance
      POSTGRES_USER: ${POSTGRES_USER:-facilefinance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: UTC
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Local development only: reachable from the host, never from the network.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d facilefinance"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-facilefinance}:${POSTGRES_PASSWORD}@db:5432/facilefinance
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "apps.worker.main"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-facilefinance}:${POSTGRES_PASSWORD}@db:5432/facilefinance
    depends_on:
      db:
        condition: service_healthy

  caddy:
    # Builds the web app to static files (stage 1) and serves them with Caddy (stage 2).
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  db_data:
  caddy_data:
  caddy_config:
