# Model per feature. Model IDs live here and nowhere else (CLAUDE.md section 8).
# Only src/facilefinance/ai/ reads this file.
#
# API constraints to respect: no forced tool use on Sonnet 5.5 / Opus 5.5 (returns an
# error); never set temperature / top_p / top_k to non-default values.

[features.file_map_proposal]
model = "claude-haiku-5-5"

[features.discrepancy_classification]
model = "claude-haiku-5-5"

[features.rule_assistant]
model = "claude-sonnet-5-5"

[features.forecast_qa]
model = "claude-sonnet-5-5"

[features.explanation]
model = "claude-sonnet-5-5"

# Compare with claude-opus-5-5 through evals/, then choose.
[features.board_report]
model = "claude-sonnet-5-5"
